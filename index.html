<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Seat Spinner — LocalStorage</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8fafc;--surface:#fff;--border:#e2e8f0;--text:#0f172a;--text-muted:#64748b;--primary:#3b82f6;--primary-light:#eff6ff;--shadow-lg:0 10px 25px -5px rgba(0,0,0,.05)}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
h1,h2,h3{font-family:'Poppins',sans-serif;font-weight:700;color:#0f172a}
.hidden{display:none!important}.flex{display:flex}.items-center{align-items:center}.justify-between{justify-content:space-between}.justify-center{justify-content:center}.text-muted{color:var(--text-muted)}
.btn{padding:12px 20px;border-radius:12px;border:none;font-weight:600;cursor:pointer;transition:all .2s;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.97)}.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:#2563eb}.btn-outline{background:var(--surface);border:1px solid var(--border);color:var(--text)}.btn-danger{background:#fef2f2;color:#ef4444;border:1px solid #fecaca}

/* LOGIN */
#login-view{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f1f5f9}
.login-wrapper{display:flex;width:100%;max-width:900px;height:550px;background:var(--surface);border-radius:30px;overflow:hidden;box-shadow:var(--shadow-lg);margin:20px}
.login-left{flex:1;background:linear-gradient(135deg,#4f46e5,#0ea5e9);padding:40px;display:flex;flex-direction:column;justify-content:center;color:#fff}
.login-left h1{color:#fff;font-size:32px;margin-bottom:16px}.login-left p{font-size:16px;opacity:.9}
.login-right{flex:1;padding:50px;display:flex;flex-direction:column;justify-content:center}
@media(max-width:768px){.login-wrapper{flex-direction:column;height:auto}.login-left{padding:30px;text-align:center}.login-right{padding:30px}}
.input-group{text-align:left;margin-bottom:20px;position:relative}
.input-group label{display:block;font-size:13px;font-weight:600;color:var(--text-muted);margin-bottom:8px}
.input-field{width:100%;padding:14px 16px 14px 44px;background:var(--bg);border:1px solid var(--border);border-radius:12px;font-size:15px;outline:none}
.input-icon{position:absolute;left:14px;top:40px;font-size:18px;color:var(--text-muted)}

/* APP NAV */
.navbar{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 0;position:sticky;top:0;z-index:100}
.container{max-width:1100px;margin:0 auto;padding:0 20px}
.logo{font-weight:800;font-size:20px;display:flex;align-items:center;gap:10px}
.logo span{background:var(--primary);color:#fff;padding:4px 8px;border-radius:8px;font-size:12px}
.nav-links{display:flex;gap:6px;overflow-x:auto}
.nav-link{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text-muted);white-space:nowrap}
.nav-link.active{background:var(--primary-light);color:var(--primary)}

/* VIEWS */
.view{display:none;padding:30px 0;animation:fadeIn .3s ease}
.view.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

/* SPIN */
.spin-container{display:flex;flex-direction:column;align-items:center;gap:24px}
.wheel-wrapper{position:relative;width:100%;max-width:350px;aspect-ratio:1/1}
.wheel-canvas{width:100%;height:100%;border-radius:50%;box-shadow:var(--shadow-lg);transition:transform 4s cubic-bezier(.17,.67,.12,.99);background:var(--surface)}
.wheel-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:50px;height:50px;background:var(--surface);border:4px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:10;font-size:20px}
.wheel-pointer{position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:25px solid #f59e0b;z-index:20}
.progress-card{background:var(--surface);padding:20px;border-radius:16px;width:100%;max-width:450px;text-align:center;border:1px solid var(--border)}
.progress-bar-bg{width:100%;height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:10px}
.progress-bar-fill{height:100%;background:var(--primary);width:0%;transition:width .4s ease}
.action-buttons{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;width:100%;max-width:450px}
.action-buttons .btn{flex:1;min-width:130px}

/* DENAH */
.classroom-container{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:30px 15px;margin-top:20px}
.whiteboard{background:#f1f5f9;color:#94a3b8;text-align:center;padding:16px;border-radius:12px;font-weight:700;max-width:400px;margin:0 auto 30px auto;border:2px dashed #cbd5e1}
.desk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:800px;margin:0 auto}
@media(max-width:600px){.desk-grid{gap:6px}}
.desk-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px}
.desk-card.filled{background:#f0fdf4;border-color:#bbf7d0}
.desk-header{display:flex;justify-content:space-between;font-size:10px;font-weight:700;color:var(--text-muted);margin-bottom:10px;border-bottom:1px solid var(--border);padding-bottom:6px}
.desk-card.filled .desk-header{color:#166534;border-color:#dcfce7}
.seat-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.seat-label{width:18px;height:18px;background:var(--bg);border-radius:4px;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700}
.seat-name{flex:1;font-size:12px;font-weight:600;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat-name.filled-text{color:#0f172a}

/* TABLE */
.table-container{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-top:20px}
table{width:100%;border-collapse:collapse;text-align:left}
th,td{padding:16px;border-bottom:1px solid var(--border);font-size:14px}
th{background:var(--bg);font-weight:600;color:var(--text-muted);font-size:12px}
.role-badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700}
.role-dev{background:#f3e8ff;color:#7e22ce}.role-admin{background:#e0f2fe;color:#0369a1}.role-user{background:#f1f5f9;color:#475569}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.3);backdrop-filter:blur(8px);z-index:1000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal-content{background:var(--surface);padding:32px;border-radius:28px;text-align:center;transform:scale(.8);transition:transform .5s cubic-bezier(.34,1.56,.64,1);max-width:90%;width:380px}
.modal-overlay.show .modal-content{transform:scale(1)}
.modal-input{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;margin-bottom:12px;font-size:14px;background:var(--bg);outline:none}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:#0f172a;color:#fff;padding:12px 24px;border-radius:8px;opacity:0;transition:all .3s;z-index:2000}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- TOAST & LOGIN -->
<div class="toast" id="toast">Pesan</div>

<div id="login-view">
  <div class="login-wrapper">
    <div class="login-left"><h1>Atur Posisi Duduk Jadi Lebih Seru.</h1><p>Sistem pengacakan tempat duduk kelas modern.</p></div>
    <div class="login-right">
      <h2 style="margin-bottom:20px;">Selamat Datang</h2>
      <div class="input-group"><label>Username</label><span class="input-icon">👤</span><input type="text" id="login-user" class="input-field" placeholder="Username"></div>
      <div class="input-group"><label>Password</label><span class="input-icon">🔒</span><input type="password" id="login-pass" class="input-field" placeholder="••••••"></div>
      <button class="btn btn-primary" id="btn-login" style="width:100%;padding:16px;" onclick="doLogin()">Masuk ke Sistem</button>
    </div>
  </div>
</div>

<!-- APP VIEW -->
<div id="app-view" class="hidden">
  <nav class="navbar"><div class="container flex justify-between items-center">
    <div class="logo" id="logo-brand"><span>CS</span> Class Spinner</div>
    <div class="nav-links" id="nav-links"></div>
    <button class="btn btn-danger" onclick="doLogout()" style="padding:8px 16px;margin-left:10px;">Logout</button>
  </div></nav>
  <div class="container">
    <div class="view" id="view-spin">
      <div class="spin-container">
        <div class="wheel-wrapper"><div class="wheel-pointer"></div><canvas id="wheel-canvas" class="wheel-canvas" width="600" height="600"></canvas><div class="wheel-center">🎯</div></div>
        <div class="progress-card"><div id="progress-text" style="font-weight:700;">0 / 42 Kursi Terisi</div><div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-bar"></div></div></div>
        <div class="action-buttons"><button class="btn btn-primary" id="btn-spin" onclick="manualSpin()" style="flex:2;">SPIN NOW</button><button class="btn btn-outline" onclick="resetAll()">RESET</button></div>
      </div>
    </div>
    <div class="view" id="view-plan">
      <div class="flex justify-between items-center" style="margin-bottom:10px;">
        <h2>Denah Kelas</h2><button class="btn btn-outline" onclick="copyRekap()">📋 Copy Rekap</button>
      </div>
      <div class="classroom-container"><div class="whiteboard">PAPAN TULIS (DEPAN)</div><div class="desk-grid" id="desk-grid"></div></div>
    </div>
    <div class="view" id="view-list" style="max-width:700px;margin:0 auto;">
      <h2 style="margin-bottom:15px;">Daftar Nama Murid</h2>
      <textarea id="input-names" style="width:100%;height:250px;padding:16px;border-radius:12px;border:1px solid var(--border);outline:none;"></textarea>
      <div style="margin-top:15px;text-align:right;"><button class="btn btn-primary" onclick="saveNames()">💾 SIMPAN DAFTAR</button></div>
    </div>
    <div class="view" id="view-manage-users">
      <div class="flex justify-between items-center" style="margin-bottom:20px;">
        <h2>Kelola Pengguna</h2><button class="btn btn-primary" onclick="openUserModal()">➕ Buat Akun Baru</button>
      </div>
      <div class="table-container"><table><thead><tr><th>Username</th><th>Role</th><th>Aksi</th></tr></thead><tbody id="user-table-body"></tbody></table></div>
    </div>
  </div>
</div>

<!-- MODALS -->
<div class="modal-overlay" id="popup-spin">
  <div class="modal-content"><div style="font-size:40px;margin-bottom:10px;">🎉</div><h3 id="popup-name" style="color:var(--primary);">Nama</h3><p id="popup-seat" style="margin-bottom:20px;">Meja 1 - Kursi A</p><button class="btn btn-primary" style="width:100%;" onclick="closePopup('popup-spin')">Tutup & Lanjut</button></div>
</div>
<div class="modal-overlay" id="popup-user">
  <div class="modal-content">
    <h3 style="margin-bottom:15px;">Buat Akun Baru</h3>
    <input type="text" id="new-user-name" class="modal-input" placeholder="Username">
    <input type="text" id="new-user-pass" class="modal-input" placeholder="Password">
    <select id="new-user-role" class="modal-input"><option value="user">User</option><option value="admin">Admin</option></select>
    <div style="display:flex;gap:10px;margin-top:20px;"><button class="btn btn-outline" style="flex:1;" onclick="closePopup('popup-user')">Batal</button><button class="btn btn-primary" style="flex:1;" onclick="saveNewUser()">Simpan</button></div>
  </div>
</div>

<!-- LOGIKA JAVASCRIPT -->
<script>
  const TOTAL_CAPACITY = 42;
  let currentUser = null;
  let state = { allNames: [], available: [], seated: [], isSpinning: false, currentAngle: 0 };
  let usersDB = [];

  // LOAD DATA DARI LOCALSTORAGE
  function initData() {
    let savedUsers = localStorage.getItem('seatSpinner_users');
    if(savedUsers) {
      usersDB = JSON.parse(savedUsers);
    } else {
      usersDB = [
        { username: "developer", pass: "dev123", role: "developer" },
        { username: "admin", pass: "admin123", role: "admin" },
        { username: "user", pass: "user123", role: "user" }
      ];
      localStorage.setItem('seatSpinner_users', JSON.stringify(usersDB));
    }

    let savedData = localStorage.getItem('seatSpinner_data');
    if(savedData) {
      const p = JSON.parse(savedData);
      state.allNames = p.allNames || [];
      state.available = p.available || [];
      state.seated = p.seated || [];
    } else {
      state.allNames = Array.from({length: 42}, (_, i) => `Siswa ${i + 1}`);
      state.available = [...state.allNames]; shuffleArray(state.available); state.seated = [];
      saveData();
    }
  }

  function saveData() { localStorage.setItem('seatSpinner_data', JSON.stringify({ allNames: state.allNames, available: state.available, seated: state.seated })); }
  function saveUsersDB() { localStorage.setItem('seatSpinner_users', JSON.stringify(usersDB)); }
  function shuffleArray(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } }

  // AUTH
  function doLogin() {
    const btn = document.getElementById('btn-login');
    const u = document.getElementById('login-user').value.trim();
    const p = document.getElementById('login-pass').value.trim();
    
    if(!u || !p) return showToast('Isi username dan password!', 'error');
    btn.innerText = 'Memproses...'; btn.disabled = true;

    setTimeout(() => {
      const user = usersDB.find(x => x.username === u && x.pass === p);
      if (user) { currentUser = user; setupUIForRole(); } 
      else { showToast('Username atau password salah!', 'error'); }
      btn.innerText = 'Masuk ke Sistem'; btn.disabled = false;
    }, 500);
  }

  function doLogout() { currentUser = null; document.getElementById('login-view').classList.remove('hidden'); document.getElementById('app-view').classList.add('hidden'); }

  function setupUIForRole() {
    document.getElementById('login-view').classList.add('hidden');
    document.getElementById('app-view').classList.remove('hidden');
    const role = currentUser.role, nav = document.getElementById('nav-links'), logo = document.getElementById('logo-brand');
    
    if (role === 'developer') {
      document.documentElement.style.setProperty('--primary', '#8b5cf6');
      logo.innerHTML = `<span style="background:#8b5cf6">DEV</span> Class Spinner`;
      nav.innerHTML = `<div class="nav-link" id="nav-spin" onclick="switchTab('spin')">Spin</div><div class="nav-link" id="nav-plan" onclick="switchTab('plan')">Denah</div><div class="nav-link" id="nav-list" onclick="switchTab('list')">Murid</div><div class="nav-link active" id="nav-manage-users" onclick="switchTab('manage-users')">Kelola Akun</div>`;
      switchTab('manage-users');
    } else if (role === 'admin') {
      document.documentElement.style.setProperty('--primary', '#0ea5e9');
      logo.innerHTML = `<span style="background:#0ea5e9">ADM</span> Class Spinner`;
      nav.innerHTML = `<div class="nav-link active" id="nav-spin" onclick="switchTab('spin')">Spin</div><div class="nav-link" id="nav-plan" onclick="switchTab('plan')">Denah</div><div class="nav-link" id="nav-list" onclick="switchTab('list')">Murid</div>`;
      switchTab('spin');
    } else {
      document.documentElement.style.setProperty('--primary', '#10b981');
      logo.innerHTML = `<span style="background:#10b981">USR</span> Class Spinner`;
      nav.innerHTML = `<div class="nav-link active" id="nav-plan" onclick="switchTab('plan')">Denah Kelas</div>`;
      switchTab('plan');
    }
  }

  function switchTab(tab) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
    document.getElementById(`view-${tab}`).classList.add('active');
    const n = document.getElementById(`nav-${tab}`); if(n) n.classList.add('active');
    if (tab === 'plan') renderLayout(); if (tab === 'spin') drawWheel(); if (tab === 'manage-users') renderUsersTable();
    if (tab === 'list') document.getElementById('input-names').value = state.allNames.join('\n');
  }

  function showToast(msg, type = 'success') { const t = document.getElementById('toast'); t.innerText = msg; t.style.background = type === 'error' ? '#ef4444' : '#0f172a'; t.className = 'toast show'; setTimeout(() => t.className = 'toast', 3000); }

  function getNextSeat() { const i = state.seated.length; if(i>=42) return null; return { desk: Math.floor(i/2)+1, seat: i%2===0?'A':'B' }; }
  function manualSpin() { if(currentUser.role==='user' || state.isSpinning || state.available.length===0) return; triggerSpin(); }
  
  function triggerSpin() {
    state.isSpinning = true; document.getElementById('btn-spin').innerText = 'SPINNING...'; document.getElementById('btn-spin').disabled = true;
    const winIdx = Math.floor(Math.random() * state.available.length), winName = state.available[winIdx];
    const canvas = document.getElementById('wheel-canvas'), seg = 360 / state.available.length, target = (360 - (winIdx * seg) - (seg / 2));
    const spins = 5 + Math.floor(Math.random() * 3), newTotal = state.currentAngle + (360 * spins) + (target - (state.currentAngle % 360));
    state.currentAngle = newTotal; canvas.style.transform = `rotate(${newTotal}deg)`;
    
    setTimeout(() => {
      state.available.splice(winIdx, 1);
      const seat = getNextSeat(); if(seat) state.seated.push({ desk: seat.desk, seat: seat.seat, name: winName });
      saveData(); updateUI(); drawWheel(); 
      document.getElementById('popup-name').innerText = winName; document.getElementById('popup-seat').innerText = `Meja ${seat.desk} - Kursi ${seat.seat}`; document.getElementById('popup-spin').classList.add('show');
      state.isSpinning = false; document.getElementById('btn-spin').innerText = 'SPIN NOW'; document.getElementById('btn-spin').disabled = false;
    }, 4000);
  }

  function drawWheel() {
    const canvas = document.getElementById('wheel-canvas'); if(!canvas) return; const ctx = canvas.getContext('2d'), r = canvas.width/2;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    if(state.available.length===0) { ctx.beginPath(); ctx.arc(r,r,r,0,2*Math.PI); ctx.fillStyle='#f1f5f9'; ctx.fill(); return; }
    const seg = (2*Math.PI)/state.available.length;
    for(let i=0; i<state.available.length; i++) {
      const colors = ['#f8fafc', '#e2e8f0']; ctx.beginPath(); ctx.moveTo(r,r); ctx.arc(r,r,r,i*seg,(i+1)*seg); ctx.fillStyle=colors[i%2]; ctx.fill(); ctx.strokeStyle='#fff'; ctx.stroke();
      ctx.save(); ctx.translate(r,r); ctx.rotate(i*seg+(seg/2)); ctx.textAlign='right'; ctx.fillStyle='#475569'; ctx.font='bold 12px Inter'; let txt = state.available[i]; if(txt.length>15) txt=txt.substring(0,13)+'...'; ctx.fillText(txt, r-20, 5); ctx.restore();
    }
  }

  function renderLayout() {
    const grid = document.getElementById('desk-grid'); if(!grid) return; grid.innerHTML = '';
    for(let i=1; i<=21; i++) {
      const A = state.seated.find(s=>s.desk===i&&s.seat==='A'), B = state.seated.find(s=>s.desk===i&&s.seat==='B'), filled = A||B;
      grid.innerHTML += `<div class="desk-card ${filled?'filled':''}"><div class="desk-header"><span>MEJA ${i}</span> ${filled?'<span style="color:#166534;">TERISI</span>':''}</div><div class="seat-row"><div class="seat-label">A</div><div class="seat-name ${A?'filled-text':''}">${A?A.name:'—'}</div></div><div class="seat-row"><div class="seat-label">B</div><div class="seat-name ${B?'filled-text':''}">${B?B.name:'—'}</div></div></div>`;
    }
  }

  function copyRekap() {
    let text = "📋 *REKAP TEMPAT DUDUK*\n\n"; let empty = true;
    for(let i=1; i<=21; i++) { const A = state.seated.find(s=>s.desk===i&&s.seat==='A'), B = state.seated.find(s=>s.desk===i&&s.seat==='B'); if(A||B) { empty=false; text += `🪑 Meja ${i} : ${A?A.name:'-'} & ${B?B.name:'-'}\n`; } }
    if(empty) return showToast('Belum ada data!', 'error');
    navigator.clipboard.writeText(text).then(() => showToast('✅ Rekap di-copy!'));
  }

  function updateUI() { const len = state.seated.length; document.getElementById('progress-text').innerText = `${len} / 42 Kursi Terisi`; document.getElementById('progress-bar').style.width = `${(len/42)*100}%`; }
  function resetAll() { if(currentUser.role==='user' || !confirm('Reset semua?')) return; state.available = [...state.allNames]; shuffleArray(state.available); state.seated = []; saveData(); updateUI(); drawWheel(); renderLayout(); }
  function saveNames() { if(currentUser.role==='user') return; const lines = document.getElementById('input-names').value.split('\n').map(s=>s.trim()).filter(s=>s!==''); if(!lines.length || lines.length>42) return showToast('Maksimal 42 nama!', 'error'); state.allNames = lines; if(!state.seated.length) { state.available = [...lines]; shuffleArray(state.available); } saveData(); showToast('Daftar disimpan!'); switchTab('spin'); }
  function closePopup(id) { document.getElementById(id).classList.remove('show'); if(id==='popup-spin' && document.getElementById('view-plan').classList.contains('active')) renderLayout(); }

  function renderUsersTable() {
    const tbody = document.getElementById('user-table-body'); tbody.innerHTML = '';
    usersDB.forEach(u => {
      const isDev = u.role === 'developer';
      tbody.innerHTML += `<tr><td style="font-weight:600;">${u.username}</td><td><span class="role-badge ${u.role==='developer'?'role-dev':(u.role==='admin'?'role-admin':'role-user')}">${u.role.toUpperCase()}</span></td><td>${isDev?'<span class="text-muted">Tidak bisa dihapus</span>':`<button class="btn btn-danger" style="padding:4px 8px; font-size:12px;" onclick="deleteUser('${u.username}')">Hapus</button>`}</td></tr>`;
    });
  }

  function openUserModal() { document.getElementById('new-user-name').value=''; document.getElementById('new-user-pass').value=''; document.getElementById('popup-user').classList.add('show'); }
  
  function saveNewUser() {
    const u = document.getElementById('new-user-name').value.trim(), p = document.getElementById('new-user-pass').value.trim(), r = document.getElementById('new-user-role').value;
    if(!u || !p) return showToast('Isi semua data!', 'error');
    if(usersDB.find(x => x.username === u)) return showToast('Username sudah dipakai!', 'error');
    usersDB.push({ username: u, pass: p, role: r });
    saveUsersDB(); closePopup('popup-user'); renderUsersTable(); showToast(`Akun ${u} dibuat!`);
  }

  function deleteUser(username) { 
    if(!confirm('Hapus akun ini?')) return; 
    usersDB = usersDB.filter(x => x.username !== username);
    saveUsersDB(); renderUsersTable(); showToast('Akun dihapus!'); 
  }

  // INIT
  window.onload = () => {
    initData();
    document.getElementById('login-view').classList.remove('hidden');
  };
</script>
</body>
